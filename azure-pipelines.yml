name: Terraform Azure Pipeline

trigger:
branches:
include:
- main
paths:
include:
- 'terraform infra/*'

pr:
branches:
include:
- main
paths:
include:
- 'terraform infra/*'

parameters:

* name: environment
  type: string
  default: dev
  values:

  * dev
  * preprod
  * prod

* name: action
  type: string
  default: plan
  values:

  * plan
  * apply
  * destroy

variables:

* name: environmentDir
  value: 'terraform infra/Enviroment/${{ parameters.environment }}'

stages:

* stage: Validate
  jobs:

  * job: Validate
    pool:
    name: self-hosted-pool
    steps:

    * checkout: self

    * script: terraform version
      displayName: Terraform Version

    * script: |
      cd "terraform infra"
      terraform fmt -check -recursive
      displayName: Terraform Format

* stage: TerraformExecution
  dependsOn: Validate
  jobs:

  * job: TerraformJob
    pool:
    name: self-hosted-pool
    steps:

    * checkout: self

    * task: AzureCLI@2
      displayName: Azure Login
      inputs:
      azureSubscription: 'azure-service-connection'
      scriptType: ps
      scriptLocation: inlineScript
      inlineScript: |
      az account show

    * script: |
      cd "$(environmentDir)"
      terraform init
      displayName: Terraform Init

    * script: |
      cd "$(environmentDir)"
      terraform validate
      displayName: Terraform Validate

    * script: |
      cd "$(environmentDir)"
      terraform plan -out=tfplan
      displayName: Terraform Plan
      condition: eq('${{ parameters.action }}', 'plan')

    * script: |
      cd "$(environmentDir)"
      terraform apply -auto-approve tfplan
      displayName: Terraform Apply
      condition: eq('${{ parameters.action }}', 'apply')

    * script: |
      cd "$(environmentDir)"
      terraform destroy -auto-approve
      displayName: Terraform Destroy
      condition: eq('${{ parameters.action }}', 'destroy')
