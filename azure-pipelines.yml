name: Terraform Azure Pipeline

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - 'terraform infra/*'

pr:
  branches:
    include:
      - main
  paths:
    include:
      - 'terraform infra/*'

parameters:
  - name: environment
    displayName: 'Target Environment'
    type: string
    default: 'dev'
    values:
      - dev
      - preprod
      - prod
  - name: action
    displayName: 'Terraform Action'
    type: string
    default: 'plan'
    values:
      - plan
      - apply
      - destroy

variables:
  - group: Azure-Terraform-Secrets # Variable group containing AZURE_CLIENT_ID, AZURE_CLIENT_SECRET, etc.
  - name: environmentDir
    value: 'terraform infra/Enviroment/${{ parameters.environment }}'

stages:
  - stage: Validate
    displayName: 'Terraform Code Validation'
    jobs:
      - job: Validate
        displayName: 'Format & Validate'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: HashiCorpInstaller@1
            inputs:
              executable: 'terraform'
              version: '1.5.0'
          - script: |
              cd "terraform infra"
              terraform fmt -check -recursive
            displayName: 'Terraform Format Check'

  - stage: TerraformExecution
    displayName: 'Terraform Execution (${{ parameters.environment }} - ${{ parameters.action }})'
    dependsOn: Validate
    jobs:
      - job: TerraformJob
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: HashiCorpInstaller@1
            inputs:
              executable: 'terraform'
              version: '1.5.0'

          - script: |
              cd "$(environmentDir)"
              terraform init
            displayName: 'Terraform Init'
            env:
              ARM_CLIENT_ID: $(AZURE_CLIENT_ID)
              ARM_CLIENT_SECRET: $(AZURE_CLIENT_SECRET)
              ARM_SUBSCRIPTION_ID: $(AZURE_SUBSCRIPTION_ID)
              ARM_TENANT_ID: $(AZURE_TENANT_ID)

          - script: |
              cd "$(environmentDir)"
              terraform validate
            displayName: 'Terraform Validate'

          - script: |
              cd "$(environmentDir)"
              terraform plan -out=tfplan
            displayName: 'Terraform Plan'
            condition: eq('${{ parameters.action }}', 'plan')
            env:
              ARM_CLIENT_ID: $(AZURE_CLIENT_ID)
              ARM_CLIENT_SECRET: $(AZURE_CLIENT_SECRET)
              ARM_SUBSCRIPTION_ID: $(AZURE_SUBSCRIPTION_ID)
              ARM_TENANT_ID: $(AZURE_TENANT_ID)

          - script: |
              cd "$(environmentDir)"
              terraform apply -auto-approve
            displayName: 'Terraform Apply'
            condition: eq('${{ parameters.action }}', 'apply')
            env:
              ARM_CLIENT_ID: $(AZURE_CLIENT_ID)
              ARM_CLIENT_SECRET: $(AZURE_CLIENT_SECRET)
              ARM_SUBSCRIPTION_ID: $(AZURE_SUBSCRIPTION_ID)
              ARM_TENANT_ID: $(AZURE_TENANT_ID)

          - script: |
              cd "$(environmentDir)"
              terraform destroy -auto-approve
            displayName: 'Terraform Destroy'
            condition: eq('${{ parameters.action }}', 'destroy')
            env:
              ARM_CLIENT_ID: $(AZURE_CLIENT_ID)
              ARM_CLIENT_SECRET: $(AZURE_CLIENT_SECRET)
              ARM_SUBSCRIPTION_ID: $(AZURE_SUBSCRIPTION_ID)
              ARM_TENANT_ID: $(AZURE_TENANT_ID)
